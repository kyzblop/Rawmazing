<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rawmazing Doula</title>
    <link rel="icon" type="image/png" href="images/Logo/Rawmazing.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=WindSong:wght@400;500&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="header"></div>

    <main class="contact">
      <section class="section-formulaire">
        <h1>Me contacter</h1>
        <form class="formulaire" id="contact-form">
          <div style="position: absolute; left: -9999px">
            <input
              type="text"
              name="website"
              tabindex="-1"
              autocomplete="off"
            />
          </div>
          <input type="text" name="name" placeholder="Votre nom" required />
          <input type="email" name="email" placeholder="Votre email" required />
          <input
            type="text"
            name="subject"
            placeholder="Sujet du message"
            required
          />
          <textarea
            name="message"
            placeholder="Votre message"
            required
          ></textarea>
          <button class="btn" type="submit" id="submit-btn">Envoyer</button>
        </form>
        <div class="toast" id="toast"></div>
      </section>

      <section class="section-coordonnes">
        <h1>Mes coordonnées</h1>
        <div class="coordonnees">
          <a href="tel:+33788026891">
            <i class="fa-solid fa-phone"></i>
            <span>+33 7 88 02 68 91</span>
          </a>

          <a href="mailto:doula.rawmazing@outlook.com">
            <i class="fa-solid fa-envelope"></i>
            <span>doula.rawmazing@outlook.com</span>
          </a>
        </div>
      </section>

      <section class="section-rdv">
        <h1>Prendre un rendez-vous</h1>

        <div class="contact-btn">
          <a class="btn-clair" href="#">Appel découverte 30 min</a>
          <a class="btn" href="#">Suivre un accompagnement</a>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
