<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Partenaires et actualité de Marlène Sabras, doula et naturopathe périnatale à Cannes. Accompagnement grossesse, accouchement, post-partum et cycle féminin."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Partenaires et actualité - Doula et Naturopathie périnatale à Cannes
    </title>
    <link rel="icon" type="image/png" href="images/Logo/Rawmazing.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=WindSong:wght@400;500&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="header"></div>

    <main class="partenaires">
      <section class="actualites-carrousel hidden" id="actualites-section">
        <div class="actualite-titre-prochainement">
          <h1>Prochainement</h1>
        </div>

        <div class="actualite-hero">
          <button class="carrousel-btn prev">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <div class="actualite-track"></div>
          <!-- Les images sont injectées par le JS -->
          <button class="carrousel-btn next">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div class="actualites-container">
          <span class="actualite-date"></span>
          <span class="actualite-message"></span>
        </div>
      </section>

      <section class="section-partenaires">
        <h1>Mes partenaires</h1>
        <div class="partenaires-card-group">
          <!-- Card Ecole Cybele -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_Cybele.png" alt="logo_Cybele" />
            </div>
            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://ecolecybele.com/"
                ><span class="partenaires-titre">Ecole Cybèle</span></a
              >
              <span class="partenaires-text">L'école qui m'a formée</span>
            </div>
          </div>

          <!-- Card Mummood -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Allaitement.png"
                alt="logo_Allaitement"
              />
            </div>

            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://mummood.com/"
                ><span class="partenaires-titre">MumMood</span></a
              >
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://www.helloasso.com/associations/mum-mood"
                ><span class="partenaires-text">Soutenez l'association</span></a
              >
            </div>
          </div>

          <!-- Card Cyclo Intima -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Cyclointima.png"
                alt="logo_Cyclo_Intima"
              />
            </div>

            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://www.cyclointima.fr/"
                ><span class="partenaires-titre">CycloIntima</span></a
              >
              <span class="partenaires-text">Code promo : à venir</span>
            </div>
          </div>

          <!-- Card L'Afman -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_Afman.png" alt="logo_Afman" />
            </div>

            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://afman.fr/"
                ><span class="partenaires-titre">L'AFMAN</span></a
              >
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://afman.fr/index.php/adhesion/"
                ><span class="partenaires-text"
                  >Adhérez à l'association</span
                ></a
              >
            </div>
          </div>

          <!-- Card DoTerra -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_DoTERRA.png" alt="logo_DoTERRA" />
            </div>

            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://office.doterra.com/marlenesabras/#/"
                ><span class="partenaires-titre">dōTERRA</span></a
              >
              <a target="_blank" rel="noopener noreferrer" href="doterra.html"
                ><span class="partenaires-text"
                  >Voir mes produits recommandés</span
                ></a
              >
            </div>
          </div>

          <!-- Card Doulas de France -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Doula_de_France.png"
                alt="logo_Doulas_de_France"
              />
            </div>

            <div class="partenaires-sous-logo">
              <a
                target="_blank"
                rel="noopener noreferrer"
                href="https://doulas.info/"
                ><span class="partenaires-titre">Doulas de France</span></a
              >
              <span class="partenaires-text">Amie des doulas</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
