<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rawmazing Doula</title>
    <link rel="icon" type="image/png" href="images/Logo/Rawmazing.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=WindSong:wght@400;500&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="header"></div>

    <main class="partenaires">
      <section class="actualites-carrousel hidden" id="actualites-section">
        <div class="actualite-titre-prochainement">
          <h1>Prochainement</h1>
        </div>

        <div class="actualite-hero">
          <button class="carrousel-btn prev"><i class="fa-solid fa-chevron-left"></i></button>
          <img class="actualite-image" alt="image_actualite" />
          <button class="carrousel-btn next"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="actualites-container">
          <h1>Prochainement</h1>
          <span class="actualite-date"></span>
          <span class="actualite-message"></span>
        </div>
      </section>

      <section class="section-partenaires">
        <h1>Mes partenaires</h1>
        <div class="partenaires-card-group">
          <!-- Card Ecole Cybele -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_Cybele.png" alt="logo_Cybele" />
            </div>

            <span class="partenaires-titre">Ecole Cybèle</span>
            <span class="partenaires-text">L'école qui m'a formée</span>
          </div>

          <!-- Card Mummood -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Allaitement.png"
                alt="logo_Allaitement"
              />
            </div>

            <span class="partenaires-titre">Mummood</span>
            <span class="partenaires-text">Soutenez l'association</span>
          </div>

          <!-- Card Cyclo Intima -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Cyclointima.png"
                alt="logo_Cyclo_Intima"
              />
            </div>

            <span class="partenaires-titre">Cyclo Intima</span>
            <span class="partenaires-text">Code promo : Rawmazing10</span>
          </div>

          <!-- Card L'Afman -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_Cybele.png" alt="logo_Afman" />
            </div>

            <span class="partenaires-titre">L'Afman</span>
            <span class="partenaires-text">Adhérez à l'association</span>
          </div>

          <!-- Card DoTerra -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img src="images/Logo/Logo_DoTERRA.png" alt="logo_DoTERRA" />
            </div>

            <span class="partenaires-titre">DoTERRA</span>
            <span class="partenaires-text"
              >Me contacter pour avoir le prix membre</span
            >
          </div>

          <!-- Card Doulas de France -->
          <div class="partenaires-card">
            <div class="partenaires-logo">
              <img
                src="images/Logo/Logo_Cybele.png"
                alt="logo_Doulas_de_France"
              />
            </div>

            <span class="partenaires-titre">Doulas de France</span>
            <span class="partenaires-text">Amie des doulas</span>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
